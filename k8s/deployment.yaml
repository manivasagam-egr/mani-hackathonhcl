# Deployment: node-service-1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-service-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-service-1
  template:
    metadata:
      labels:
        app: node-service-1
    spec:
      containers:
        - name: node-service-1
          image: us-central1-docker.pkg.dev/mani-hackathon/hackathon-repo/node-service-1:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"

          # ✅ ADD THIS BLOCK
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10

